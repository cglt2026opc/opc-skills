name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository
        run: python3 scripts/validate_repo.py

      - name: Verify skill catalog count
        run: test "$(python3 scripts/opc_skills.py list | wc -l)" -eq 1

      - name: Test integrated and standalone distribution
        run: python3 scripts/test_distribution.py

      - name: Smoke-test release packaging
        run: |
          python3 scripts/build_release.py --output /tmp/opc-skills-release
          test "$(find /tmp/opc-skills-release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 25
